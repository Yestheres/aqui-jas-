services:
  - type: worker
    name: aqui-jas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DEV_GUILDS
        value: ""
      - key: DATABASE_PATH
        value: data/bot.sqlite3
      - key: LOG_LEVEL
        value: INFO
